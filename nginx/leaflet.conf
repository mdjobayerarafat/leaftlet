# Leaflet — nginx reverse proxy for the Leaflet container.
# Install to /etc/nginx/sites-available/leaflet.conf then:
#   ln -s /etc/nginx/sites-available/leaflet.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;

    # Large PDF uploads (Appwrite bucket allows up to 300MB).
    client_max_body_size 320M;

    # Sensible timeouts for AI routes (metadata generation can take ~60s).
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static assets are immutable (hashed filenames).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js image optimizer responses.
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
